<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" font-family="'SF Mono', 'Fira Code', monospace">
  <rect width="720" height="560" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="36" y="42" font-size="13" font-weight="600" fill="#111" letter-spacing="0.5">CUSTOMER INQUIRY FLOW</text>
  <text x="36" y="58" font-size="10" fill="#888" letter-spacing="0.3">GlanAir Home Solutions — Inbound to Resolution</text>
  <line x1="36" y1="68" x2="684" y2="68" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Node styles -->
  <!-- Start node -->
  <rect x="290" y="88" width="140" height="40" rx="20" fill="#111" />
  <text x="360" y="113" text-anchor="middle" font-size="11" fill="#fff" font-weight="500">Inbound Enquiry</text>

  <!-- Arrow down -->
  <line x1="360" y1="128" x2="360" y2="150" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="356,148 364,148 360,155" fill="#bbb"/>

  <!-- FAQ Check decision -->
  <polygon points="360,155 440,182 360,209 280,182" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="179" text-anchor="middle" font-size="10" fill="#333">FAQ Match?</text>
  <text x="360" y="193" text-anchor="middle" font-size="9" fill="#666">Check knowledge base</text>

  <!-- YES branch left -->
  <line x1="280" y1="182" x2="160" y2="182" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="162,178 162,186 155,182" fill="#bbb"/>
  <text x="218" y="175" text-anchor="middle" font-size="9" fill="#666">YES</text>

  <!-- AI Agent box -->
  <rect x="60" y="162" width="120" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="181" text-anchor="middle" font-size="10" fill="#333" font-weight="500">AI Agent</text>
  <text x="120" y="194" text-anchor="middle" font-size="9" fill="#666">Agentforce handles</text>

  <!-- Arrow from AI Agent down -->
  <line x1="120" y1="202" x2="120" y2="240" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="116,238 124,238 120,245" fill="#bbb"/>

  <!-- Resolved box left -->
  <rect x="60" y="245" width="120" height="40" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5"/>
  <text x="120" y="264" text-anchor="middle" font-size="10" fill="#444">Case Resolved</text>
  <text x="120" y="277" text-anchor="middle" font-size="9" fill="#666">Auto-closed</text>

  <!-- NO branch right -->
  <line x1="440" y1="182" x2="520" y2="182" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="518,178 518,186 525,182" fill="#bbb"/>
  <text x="480" y="175" text-anchor="middle" font-size="9" fill="#666">NO</text>

  <!-- Human Queue box -->
  <rect x="520" y="162" width="140" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="590" y="181" text-anchor="middle" font-size="10" fill="#333" font-weight="500">Human Queue</text>
  <text x="590" y="194" text-anchor="middle" font-size="9" fill="#666">Manual review task created</text>

  <!-- Arrow from Human Queue down -->
  <line x1="590" y1="202" x2="590" y2="240" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="586,238 594,238 590,245" fill="#bbb"/>

  <!-- SLA timer box -->
  <rect x="520" y="245" width="140" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="590" y="264" text-anchor="middle" font-size="10" fill="#333" font-weight="500">SLA Timer: T+30</text>
  <text x="590" y="277" text-anchor="middle" font-size="9" fill="#666">Monitor flow active</text>

  <!-- Arrow from SLA down -->
  <line x1="590" y1="285" x2="590" y2="320" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="586,318 594,318 590,325" fill="#bbb"/>

  <!-- SLA breach decision -->
  <polygon points="590,325 650,348 590,371 530,348" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="590" y="345" text-anchor="middle" font-size="10" fill="#333">Resolved?</text>
  <text x="590" y="359" text-anchor="middle" font-size="9" fill="#666">at T+30</text>

  <!-- YES resolved -->
  <line x1="530" y1="348" x2="440" y2="348" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="442,344 442,352 435,348" fill="#bbb"/>
  <text x="484" y="341" text-anchor="middle" font-size="9" fill="#666">YES</text>
  <rect x="300" y="328" width="140" height="40" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5"/>
  <text x="370" y="347" text-anchor="middle" font-size="10" fill="#444">Case Resolved</text>
  <text x="370" y="360" text-anchor="middle" font-size="9" fill="#666">Within SLA</text>

  <!-- NO breach -->
  <line x1="590" y1="371" x2="590" y2="406" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="586,404 594,404 590,411" fill="#bbb"/>
  <text x="600" y="392" font-size="9" fill="#c00">NO</text>
  <rect x="520" y="411" width="140" height="40" rx="4" fill="#fff" stroke="#c00" stroke-width="1.5"/>
  <text x="590" y="430" text-anchor="middle" font-size="10" fill="#c00" font-weight="500">SLA Breach Alert</text>
  <text x="590" y="443" text-anchor="middle" font-size="9" fill="#c00">High priority task created</text>

  <!-- Main resolved node -->
  <line x1="360" y1="368" x2="360" y2="465" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="120" y1="285" x2="120" y2="465" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="120" y1="465" x2="360" y2="465" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="360" y1="465" x2="360" y2="480" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="356,478 364,478 360,485" fill="#bbb"/>

  <!-- End: post sale check -->
  <rect x="260" y="485" width="200" height="40" rx="4" fill="#111" />
  <text x="360" y="504" text-anchor="middle" font-size="10" fill="#fff" font-weight="500">Post-Sale Health Trigger</text>
  <text x="360" y="517" text-anchor="middle" font-size="9" fill="#aaa">Customer health record created</text>

  <!-- Legend -->
  <rect x="36" y="490" width="12" height="12" rx="2" fill="#111"/>
  <text x="54" y="501" font-size="9" fill="#666">Automated action</text>
  <rect x="36" y="510" width="12" height="12" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="54" y="521" font-size="9" fill="#666">Human or decision step</text>
  <rect x="36" y="530" width="12" height="12" rx="2" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5"/>
  <text x="54" y="541" font-size="9" fill="#666">Terminal state</text>
</svg>
