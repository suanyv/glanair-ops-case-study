<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="'SF Mono', 'Fira Code', monospace">
  <rect width="720" height="420" fill="#fafafa"/>

  <text x="36" y="30" font-size="13" font-weight="600" fill="#111" letter-spacing="0.5">ESCALATION PATH</text>
  <text x="36" y="46" font-size="10" fill="#888" letter-spacing="0.3">SLA monitoring and case escalation logic</text>
  <line x1="36" y1="55" x2="684" y2="55" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Case created -->
  <rect x="280" y="75" width="160" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="94" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Case Created</text>
  <text x="360" y="107" text-anchor="middle" font-size="9" fill="#666">SLA due date: T+30 min</text>

  <line x1="360" y1="115" x2="360" y2="140" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="356,138 364,138 360,145" fill="#bbb"/>

  <!-- T+30 check -->
  <polygon points="360,145 450,170 360,195 270,170" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="167" text-anchor="middle" font-size="10" fill="#333">T+30 check</text>
  <text x="360" y="181" text-anchor="middle" font-size="9" fill="#666">Case still open?</text>

  <!-- NO branch — resolved within SLA -->
  <line x1="270" y1="170" x2="160" y2="170" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="162,166 162,174 155,170" fill="#bbb"/>
  <text x="212" y="163" text-anchor="middle" font-size="9" fill="#666">NO</text>

  <rect x="60" y="150" width="100" height="40" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5"/>
  <text x="110" y="169" text-anchor="middle" font-size="10" fill="#444">Resolved</text>
  <text x="110" y="182" text-anchor="middle" font-size="9" fill="#666">within SLA ✓</text>

  <!-- YES branch — SLA breach -->
  <line x1="360" y1="195" x2="360" y2="225" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="356,223 364,223 360,230" fill="#bbb"/>
  <text x="370" y="215" font-size="9" fill="#c00">YES</text>

  <rect x="280" y="230" width="160" height="40" rx="4" fill="#fff" stroke="#c00" stroke-width="1.5"/>
  <text x="360" y="249" text-anchor="middle" font-size="10" font-weight="600" fill="#c00">SLA Breach Alert</text>
  <text x="360" y="262" text-anchor="middle" font-size="9" fill="#c00">High priority task created</text>

  <line x1="360" y1="270" x2="360" y2="295" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="356,293 364,293 360,300" fill="#bbb"/>

  <!-- T+60 check -->
  <polygon points="360,300 450,325 360,350 270,325" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="322" text-anchor="middle" font-size="10" fill="#333">T+60 check</text>
  <text x="360" y="336" text-anchor="middle" font-size="9" fill="#666">Alert actioned?</text>

  <!-- YES actioned -->
  <line x1="270" y1="325" x2="160" y2="325" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="162,321 162,329 155,325" fill="#bbb"/>
  <text x="212" y="318" text-anchor="middle" font-size="9" fill="#666">YES</text>

  <rect x="60" y="305" width="100" height="40" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5"/>
  <text x="110" y="324" text-anchor="middle" font-size="10" fill="#444">Resolved</text>
  <text x="110" y="337" text-anchor="middle" font-size="9" fill="#666">late, but closed</text>

  <!-- NO escalate -->
  <line x1="360" y1="350" x2="360" y2="375" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="356,373 364,373 360,380" fill="#bbb"/>
  <text x="370" y="368" font-size="9" fill="#c00">NO</text>

  <rect x="260" y="380" width="200" height="30" rx="4" fill="#111"/>
  <text x="360" y="399" text-anchor="middle" font-size="10" fill="#fff" font-weight="500">Priority → High · Reassign owner</text>

  <!-- Special path: fault/complaint -->
  <rect x="540" y="150" width="144" height="50" rx="4" fill="#fff" stroke="#c00" stroke-width="1.5"/>
  <text x="612" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#c00">Fault / Complaint</text>
  <text x="612" y="184" text-anchor="middle" font-size="9" fill="#c00">Bypass SLA monitor</text>
  <text x="612" y="197" text-anchor="middle" font-size="9" fill="#c00">Immediate → Critical</text>

  <line x1="540" y1="175" x2="440" y2="175" stroke="#c00" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="442,171 442,179 435,175" fill="#c00"/>
  <text x="490" y="168" text-anchor="middle" font-size="8" fill="#c00">direct path</text>
</svg>
