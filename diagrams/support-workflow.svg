<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="'SF Mono', 'Fira Code', monospace">
  <rect width="720" height="440" fill="#fafafa"/>

  <text x="36" y="30" font-size="13" font-weight="600" fill="#111" letter-spacing="0.5">SUPPORT WORKFLOW</text>
  <text x="36" y="46" font-size="10" fill="#888" letter-spacing="0.3">Case triage, routing, and resolution</text>
  <line x1="36" y1="55" x2="684" y2="55" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Case opened -->
  <rect x="280" y="75" width="160" height="40" rx="20" fill="#111"/>
  <text x="360" y="100" text-anchor="middle" font-size="11" fill="#fff" font-weight="500">Case Opened</text>

  <line x1="360" y1="115" x2="360" y2="140" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="356,138 364,138 360,145" fill="#bbb"/>

  <!-- Category classification -->
  <rect x="260" y="145" width="200" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="164" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Classify Category</text>
  <text x="360" y="177" text-anchor="middle" font-size="9" fill="#666">Product / Allergen / Logistics / Pricing / Stock / Post-Sale</text>

  <line x1="360" y1="185" x2="360" y2="210" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="356,208 364,208 360,215" fill="#bbb"/>

  <!-- FAQ check -->
  <polygon points="360,215 450,240 360,265 270,240" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="237" text-anchor="middle" font-size="10" fill="#333">FAQ match?</text>
  <text x="360" y="251" text-anchor="middle" font-size="9" fill="#666">Knowledge base lookup</text>

  <!-- YES — agent handles -->
  <line x1="450" y1="240" x2="560" y2="240" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="558,236 558,244 565,240" fill="#bbb"/>
  <text x="505" y="233" text-anchor="middle" font-size="9" fill="#666">YES</text>

  <rect x="565" y="220" width="120" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="625" y="239" text-anchor="middle" font-size="10" font-weight="500" fill="#333">Agent Handles</text>
  <text x="625" y="252" text-anchor="middle" font-size="9" fill="#666">Auto-closed</text>

  <!-- NO — human queue -->
  <line x1="360" y1="265" x2="360" y2="290" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="356,288 364,288 360,295" fill="#bbb"/>
  <text x="370" y="282" font-size="9" fill="#333">NO</text>

  <rect x="260" y="295" width="200" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="314" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Human Queue</text>
  <text x="360" y="327" text-anchor="middle" font-size="9" fill="#666">Assign owner · SLA timer active</text>

  <!-- Two paths from human queue -->
  <line x1="260" y1="315" x2="180" y2="315" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="182,311 182,319 175,315" fill="#bbb"/>
  <text x="218" y="308" text-anchor="middle" font-size="9" fill="#666">Standard</text>

  <rect x="60" y="295" width="120" height="40" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5"/>
  <text x="120" y="314" text-anchor="middle" font-size="10" fill="#444">Draft response</text>
  <text x="120" y="327" text-anchor="middle" font-size="9" fill="#666">Close within SLA</text>

  <!-- Fault path -->
  <line x1="460" y1="315" x2="540" y2="315" stroke="#c00" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="538,311 538,319 545,315" fill="#c00"/>
  <text x="500" y="308" text-anchor="middle" font-size="9" fill="#c00">Fault/complaint</text>

  <rect x="545" y="295" width="130" height="40" rx="4" fill="#fff" stroke="#c00" stroke-width="1.5"/>
  <text x="610" y="314" text-anchor="middle" font-size="10" fill="#c00" font-weight="500">Escalate: Critical</text>
  <text x="610" y="327" text-anchor="middle" font-size="9" fill="#c00">24hr resolution plan</text>

  <!-- FAQ gap note -->
  <line x1="360" y1="335" x2="360" y2="360" stroke="#bbb" stroke-width="1.5"/>
  <polygon points="356,358 364,358 360,365" fill="#bbb"/>

  <rect x="260" y="365" width="200" height="40" rx="4" fill="#fff" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="360" y="384" text-anchor="middle" font-size="10" fill="#666">Flag for FAQ review</text>
  <text x="360" y="397" text-anchor="middle" font-size="9" fill="#888">New question type → KB addition</text>

  <!-- Note at bottom -->
  <text x="36" y="425" font-size="9" fill="#aaa">FAQ gap signals feed the knowledge base expansion cycle — each manual review task is a potential deflection improvement.</text>
</svg>
